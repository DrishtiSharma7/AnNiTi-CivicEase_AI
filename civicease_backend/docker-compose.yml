services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: civic, POSTGRES_PASSWORD: civic, POSTGRES_DB: civicease}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://civic:civic@db:5432/civicease
      USE_PGVECTOR: "true"
      WORKER_URL: http://worker:9000
      PORTAL_BASE_URL: http://api:8000
      ALLOWED_PORTAL_DOMAINS: api
    ports: ["8000:8000"]
    depends_on: [db, worker]
    networks: [default, sandbox]
    volumes: [files:/srv/storage]
  worker:
    build: {context: ., dockerfile: Dockerfile.worker}
    environment:
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-change-me-long-random}
      ALLOWED_PORTAL_DOMAINS: api
      USE_PLAYWRIGHT: "false"
    networks: [sandbox]          # internal network: reaches only the API, no internet, no database
networks:
  sandbox: {internal: true}
volumes: {pgdata: {}, files: {}}
